name: INBOX9 production observability

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Production health and telemetry canary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run production observability smoke
        env:
          PRODUCTION_BASE_URL: https://inbox9.onrender.com
        run: node scripts/production-observability-smoke.mjs
      - name: Publish commit status
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          GATE_STATE: ${{ job.status }}
        with:
          script: |
            const state = process.env.GATE_STATE === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ci/inbox9-observability',
              description: state === 'success' ? 'Release gate passed' : 'Release gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
