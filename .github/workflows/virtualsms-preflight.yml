name: VirtualSMS provider preflight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Readiness depth. inventory = auth + India + service catalog; canary-ready = also verify resale/canary flags and every allowlisted mapping."
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - canary-ready
      service_id:
        description: "Optional single INBOX9 service ID to validate against the explicit provider mapping."
        required: false
        type: string

concurrency:
  group: virtualsms-provider-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Authenticated provider readiness (purchase-blocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VIRTUALSMS_API_KEY: ${{ secrets.VIRTUALSMS_API_KEY }}
      VIRTUALSMS_BASE_URL: ${{ secrets.VIRTUALSMS_BASE_URL }}
      VIRTUALSMS_RESELLER_AUTHORIZED: ${{ secrets.VIRTUALSMS_RESELLER_AUTHORIZED }}
      VIRTUALSMS_CANARY_ENABLED: ${{ secrets.VIRTUALSMS_CANARY_ENABLED }}
      VIRTUALSMS_ALLOWED_SERVICE_IDS_JSON: ${{ secrets.VIRTUALSMS_ALLOWED_SERVICE_IDS_JSON }}
      VIRTUALSMS_SERVICE_MAP_JSON: ${{ secrets.VIRTUALSMS_SERVICE_MAP_JSON }}
      VIRTUALSMS_PREFLIGHT_MODE: ${{ inputs.mode }}
      VIRTUALSMS_PREFLIGHT_SERVICE_ID: ${{ inputs.service_id }}
      VIRTUALSMS_PREFLIGHT_ONLY: "true"
    steps:
      - name: Check secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VIRTUALSMS_API_KEY}" || { echo "Missing GitHub Actions secret: VIRTUALSMS_API_KEY" >&2; exit 2; }
          echo "API key secret: configured"
          echo "Base URL override: ${VIRTUALSMS_BASE_URL:+configured}"
          echo "Resale authorization flag: ${VIRTUALSMS_RESELLER_AUTHORIZED:+configured}"
          echo "Canary flag: ${VIRTUALSMS_CANARY_ENABLED:+configured}"
          echo "Service allowlist: ${VIRTUALSMS_ALLOWED_SERVICE_IDS_JSON:+configured}"
          echo "Service mapping: ${VIRTUALSMS_SERVICE_MAP_JSON:+configured}"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Static safety check
        run: npm run check

      - name: Execute purchase-blocked provider preflight
        run: npm run virtualsms:preflight

      - name: Summarize safe result
        if: success()
        run: |
          echo "VirtualSMS preflight passed."
          echo "This workflow sets VIRTUALSMS_PREFLIGHT_ONLY=true and the provider adapter hard-blocks purchase operations."
          echo "No number allocation is attempted by this workflow."
