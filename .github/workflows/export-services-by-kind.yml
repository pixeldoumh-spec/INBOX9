name: Validate service catalog export

on:
  push:
    branches: [main]
    paths:
      - 'data/services.json'
      - 'data/services-by-kind.csv'
      - 'scripts/export-services-by-kind.mjs'
      - '.github/workflows/export-services-by-kind.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate and validate service catalog export
        run: |
          node scripts/export-services-by-kind.mjs
          git diff --exit-code -- data/services-by-kind.csv
