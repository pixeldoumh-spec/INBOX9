name: INBOX9 CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INBOX9_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inbox9_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inbox9_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inbox9_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run issue9:e2e
      - name: Secret pattern scan
        shell: bash
        run: |
          if grep -RInE "(sk_live|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" --exclude-dir=.git --exclude=ci.yml .; then
            echo "Potential secret material found in repository" >&2
            exit 1
          fi
