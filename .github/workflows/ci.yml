name: INBOX9 CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run issue9:e2e
      - name: Secret pattern scan
        shell: bash
        run: |
          if grep -RInE "(sk_live|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" --exclude-dir=.git .; then
            echo "Potential secret material found in repository" >&2
            exit 1
          fi
