name: INBOX9 frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Frontend / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build
      - name: Service logo manifest regression test
        run: node --test tests/service-logo-manifest.test.js
      - name: PWA installability regression test
        run: node --test tests/pwa-assets.test.js
      - name: Mobile launcher layout regression test
        run: node --test tests/mobile-ui-phase1.test.js
      - name: Publish commit status
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          GATE_STATE: ${{ job.status }}
        with:
          script: |
            const state = process.env.GATE_STATE === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ci/inbox9-frontend',
              description: state === 'success' ? 'Release gate passed' : 'Release gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
