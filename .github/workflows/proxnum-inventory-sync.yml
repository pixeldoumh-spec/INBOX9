name: INBOX9 Proxnum inventory sync

on:
  schedule:
    - cron: "4/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      id-token: write
      contents: none
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: inbox9-proxnum-inventory
      cancel-in-progress: false
    steps:
      - name: Request GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=inbox9"
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "$token_url")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          curl --fail --silent --show-error --retry 3 --retry-delay 5             -X POST "https://inbox9.onrender.com/api/internal-proxnum-inventory-sync"             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             --data '{}'
