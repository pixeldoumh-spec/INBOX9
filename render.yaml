services:
  - type: web
    name: inbox9
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --ignore-scripts && npm install --prefix frontend --include=dev --no-audit --no-fund && npm run build --prefix frontend
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: INBOX9_RUNTIME_MODE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: APP_ORIGIN
        fromService:
          name: inbox9
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        generateValue: true
      - key: INBOX9_ENABLE_RECHARGE
        value: "false"
      - key: INBOX9_UPI_ID
        value: ""
      - key: INBOX9_ENABLE_EXTERNAL_ROUTING
        value: "false"
      - key: INBOX9_ALLOW_NONCANCELLABLE_PROVIDER_RESERVE
        value: "false"
      - key: INBOX9_RUN_BILLABLE_PROVIDER_CANARY
        value: "false"
      - key: INBOX9_PROVIDER_CANARY_MAX_COST_USD
        value: "1"
      - key: INBOX9_PROVIDER_CANARY_MAX_WAIT_MS
        value: "30000"
      - key: INBOX9_PROVIDER_CANARY_POLL_INTERVAL_MS
        value: "3000"
      - key: INBOX9_PROVIDER_CERT_MAX_AGE_MS
        value: "86400000"
      - key: INBOX9_ASMS_BASE_URL
        value: "https://asms.ai"
      - key: INBOX9_ASMS_API_KEY
        sync: false
      - key: INBOX9_ASMS_COUNTRY_MAP_JSON
        value: ""
      - key: INBOX9_PVAPINS_BASE_URL
        value: "https://api.pvapins.com"
      - key: INBOX9_PVAPINS_API_KEY
        sync: false
      - key: INBOX9_SVNUMBER_BASE_URL
        value: "https://sms-verification-number.com/stubs/handler_api"
      - key: INBOX9_SVNUMBER_API_KEY
        sync: false
