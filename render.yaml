services:
  - type: web
    name: inbox9
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --ignore-scripts
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: INBOX9_RUNTIME_MODE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: APP_ORIGIN
        fromService:
          name: inbox9
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        generateValue: true
      - key: INBOX9_ENABLE_RECHARGE
        value: "false"
      - key: INBOX9_UPI_ID
        value: ""
