<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="INBOX9 — OTP activation marketplace.">
  <meta name="color-scheme" content="dark">
  <title>INBOX9 — OTP Marketplace</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .boot-loader{min-height:100vh;display:grid;place-items:center;padding:24px;background:#080b12;color:#eef3f8;font:500 13px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot-loader-inner{display:flex;align-items:center;justify-content:center}
    .boot-brand{display:flex;align-items:center;gap:10px;opacity:0;animation:boot-fade-in .22s ease-out forwards}
    .boot-brand-mark{height:42px;width:42px;border-radius:12px;background:#8df26b;color:#071007;display:grid;place-items:center;font:700 23px/1 system-ui,-apple-system,sans-serif;box-shadow:0 0 36px rgba(141,242,107,.16)}
    .boot-brand-name{font:700 18px/1 Space Grotesk,system-ui,sans-serif;letter-spacing:.10em;color:#eef3f8}
    .boot-brand-sub{display:block;margin-top:3px;color:#718096;font-size:9px;letter-spacing:.16em}
    .boot-error{color:#ffb0b0;text-align:center}
    @keyframes boot-fade-in{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.boot-brand{animation:none;opacity:1}}
  </style>
</head>
<body>
  <noscript>This app needs JavaScript enabled.</noscript>
  <div id="app" aria-live="polite" aria-busy="true">
    <div class="boot-loader" role="status" aria-label="Loading INBOX9">
      <div class="boot-loader-inner">
        <div class="boot-brand">
          <span class="boot-brand-mark" aria-hidden="true">ϟ</span>
          <span>
            <strong class="boot-brand-name">INBOX9</strong>
            <span class="boot-brand-sub">OTP MARKETPLACE</span>
          </span>
        </div>
      </div>
    </div>
  </div>
  <script src="/boot.js" defer data-app-script="/app.js"></script>
</body>
</html>
